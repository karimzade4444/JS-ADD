<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
   
    <div class="backmodal">
        <div class="modal">
            <div class="modaltop"><h1>Предпросмотр</h1><p class="closes">Закрыть</p></div>
            <div class="imgmodal">
            </div>
            <div style="display: flex; justify-content: center; align-items: center;
            padding: 0 50px;">
            <div class="textmodal"><h1 class="paraginmodal"></h1><p class="textinmodal"></p></div>
            <button class="editmodalbtn">Изменить</button>
            </div>
        </div>
        
    </div>

    <div class="backeditmodal">
        <div class="editmodal">
            <div class="editmodaltop"><h1>Новый материал</h1><p class="close">Закрыть</p></div>
            <div class="inpedit1">
                <p>Название *</p>
                <input type="text" placeholder="Напр: JavaScript" style="color: white;" class="nameinp">
            </div>

            <div class="inpedit1">
                <p>Ссылка на изоброжение</p>
                <input type="text" placeholder="https://..." style="color: white;" class="imginp">
            </div>

            <div class="inpedit2">
                <p>Описание *</p>
                <textarea placeholder="Коротко опишите материал" class="tarea"></textarea>
            </div>
            <div class="EditCancel">
                <button class="Canceledit">Отмена</button>
                <button class="Editedit">Изменить</button>
            </div>
            </div>
            </div>

     <div class="backcreatmodal">
        <div class="creatmodal">
            <div class="creatmodaltop"><h1>Новый материал</h1><p class="close">Закрыть</p></div>
            <div class="inp1">
                <p>Название *</p>
                <input type="text" placeholder="Напр: JavaScript" style="color: white;" class="nameinp">
            </div>

            <div class="inp1">
                <p>Ссылка на изоброжение</p>
                <input type="text" placeholder="https://..." style="color: white;" class="imginp">
            </div>

            <div class="inp2">
                <p>Описание *</p>
                <textarea placeholder="Коротко опишите материал" class="tarea"></textarea>
            </div>
            <div class="CreatCancel">
                <button class="Cancel">Отмена</button>
                <button class="Creat">Создать</button>
            </div>

        </div>
    </div>

    <div class="Header">
      <div class="top">
        <div class="topLeft">
          <h1>Мини-CRUD (Новости)</h1>
          <p>Поиск•Модальные окна•Карточки</p>
        </div>
        <div class="topRight">
          <p class="count">Всего: 0</p>
          <button class="add">+ Добавить</button>
        </div>
      </div>
      <input type="text" placeholder="Поиск по названию..." class="Search" />
      <div class="middle">
        
      </div>
      <button class="News">▶ Подсказки (доп.новости)</button>
       
    </div>
    <script src="scr.js"></script>
  </body>
</html>
