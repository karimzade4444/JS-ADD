<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
   
    <div class="backmodal">
        <div class="modal">
            <div class="modaltop"><h1>Предпросмотр</h1><p class="closes">Закрыть</p></div>
            <div class="imgmodal"></div>
            <div class="textmodal"></div>
        </div>
    </div>

     <div class="backcreatmodal">
        <div class="creatmodal">
            <div class="creatmodaltop"><h1>Новый материал</h1><p class="close">Закрыть</p></div>
            <div class="inp1">
                <p>Название *</p>
                <input type="text" placeholder="Напр: JavaScript">
            </div>

            <div class="inp1">
                <p>Ссылка на изоброжение</p>
                <input type="text" placeholder="https://...">
            </div>

            <div class="inp2">
                <p>Описание *</p>
                <textarea placeholder="Коротко опишите материал" class="tarea"></textarea>
            </div>
            <div class="CreatCancel">
                <button class="Cancel">Отмена</button>
                <button class="Creat">Создать</button>
            </div>

        </div>
    </div>

    <div class="Header">
      <div class="top">
        <div class="topLeft">
          <h1>Мини-CRUD (Новости)</h1>
          <p>Поиск•Модальные окна•Карточки</p>
        </div>
        <div class="topRight">
          <p>Всего:</p>
          <button class="add">+ Добавить</button>
        </div>
      </div>
      <input type="text" placeholder="Поиск по названию..." class="Search" />
      <div class="middle">
        <div class="new">
          <div class="img"><img src="https://i.pinimg.com/736x/06/14/fa/0614fa155de10e2072149b780c3e2e60.jpg" alt="" style="object-fit: cover;width: 100%;height: 100%;border-radius: 20px 20px 0 0;"></div>
          <div class="about">
            <h1 class="Parag">Tajikistan</h1>
            <p class="text">Feel the friendship </p>
        </div>
        <div class="edit">
            <button class="view">Просмотр</button>
            <button class="delete">Удалить</button>
        </div>
        </div>
      </div>
      <button class="News">▶ Подсказки (доп.новости)</button>
       
    </div>
    <script src="scr.js"></script>
  </body>
</html>
